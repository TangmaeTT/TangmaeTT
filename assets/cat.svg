<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="480" height="180" role="img" aria-label="A black cat curled up by a warm lamp at night">
  <defs>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb457" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffb457" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241b16"/>
      <stop offset="1" stop-color="#180f0c"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2b"/>
      <stop offset="1" stop-color="#1d2740"/>
    </linearGradient>
  </defs>

  <rect width="480" height="180" rx="14" fill="url(#wall)"/>

  <!-- window -->
  <g>
    <rect x="34" y="24" width="78" height="64" rx="6" fill="url(#night)" stroke="#3d2d23" stroke-width="2"/>
    <path d="M73 24v64M34 56h78" stroke="#3d2d23" stroke-width="2"/>
    <g fill="#fff5d6">
      <circle cx="50" cy="38" r="1.3"><animate attributeName="opacity" values="1;.15;1" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="62" cy="47" r="1"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="92" cy="36" r="1.2"><animate attributeName="opacity" values="1;.2;1" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="101" cy="70" r="1"><animate attributeName="opacity" values=".2;.9;.2" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="45" cy="74" r="1.1"><animate attributeName="opacity" values=".8;.1;.8" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>
    <path d="M88 34a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="#f3e2b4" opacity=".85"/>
  </g>

  <!-- hanging lamp -->
  <g>
    <path d="M404 0v22" stroke="#5a4335" stroke-width="2"/>
    <path d="M386 44l18-22 18 22z" fill="#e08b3c"/>
    <ellipse cx="404" cy="44" rx="18" ry="3.5" fill="#ffd08a"/>
    <ellipse cx="404" cy="100" rx="86" ry="72" fill="url(#glow)"/>
    <circle cx="404" cy="48" r="4" fill="#fff1c9">
      <animate attributeName="opacity" values="1;.75;1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floor -->
  <path d="M0 142h480v38a14 14 0 0 1-14 14H14A14 14 0 0 1 0 166z" fill="#160f0c"/>
  <path d="M0 142h480" stroke="#3a2a20" stroke-width="2"/>

  <!-- books -->
  <g stroke="#2b1d16" stroke-width="1.5">
    <rect x="318" y="130" width="52" height="12" rx="2" fill="#8c4a3a"/>
    <rect x="324" y="120" width="44" height="10" rx="2" fill="#6b6236"/>
    <rect x="330" y="111" width="34" height="9" rx="2" fill="#4a5a63"/>
  </g>

  <!-- mug + steam -->
  <g>
    <rect x="140" y="124" width="20" height="18" rx="3" fill="#c9a227" stroke="#2b1d16" stroke-width="1.5"/>
    <path d="M160 129h5a5 5 0 0 1 0 9h-5" fill="none" stroke="#2b1d16" stroke-width="1.5"/>
    <g stroke="#ffe3b0" stroke-width="1.6" stroke-linecap="round" fill="none">
      <path d="M146 120c-3-4 3-6 0-10">
        <animate attributeName="opacity" values="0;.7;0" dur="3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M154 120c-3-4 3-6 0-10">
        <animate attributeName="opacity" values="0;.6;0" dur="3s" begin="1.2s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- the cat -->
  <g>
    <ellipse cx="242" cy="143" rx="62" ry="7" fill="#000" opacity=".45"/>

    <!-- tail -->
    <path d="M282 136c22 4 30-6 24-16" fill="none" stroke="#14100e" stroke-width="9" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="0 282 136;-9 282 136;0 282 136;5 282 136;0 282 136" dur="4.5s" repeatCount="indefinite"/>
    </path>

    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1 1.025;1 1" dur="3.6s" additive="sum" repeatCount="indefinite"/>
      <!-- body -->
      <path d="M186 138c-6-26 14-42 44-42s54 14 54 30c0 8-6 12-14 12z" fill="#14100e" stroke="#4a3527" stroke-width="1.5"/>
      <!-- head -->
      <g>
        <path d="M181 100l-3-15 14 7zM213 100l3-15-14 7z" fill="#14100e" stroke="#4a3527" stroke-width="1.5" stroke-linejoin="round"/>
        <ellipse cx="197" cy="108" rx="22" ry="19" fill="#14100e" stroke="#4a3527" stroke-width="1.5"/>
        <!-- eyes -->
        <g fill="#ffc94d">
          <ellipse cx="189" cy="107" rx="3" ry="3.4">
            <animate id="b" attributeName="ry" values="3.4;.3;3.4" dur=".28s" begin="0s;b.end+3.4s"/>
          </ellipse>
          <ellipse cx="205" cy="107" rx="3" ry="3.4">
            <animate attributeName="ry" values="3.4;.3;3.4" dur=".28s" begin="b.begin"/>
          </ellipse>
        </g>
        <path d="M197 114l-3 2.5h6z" fill="#e6a0a8"/>
        <g stroke="#5c4436" stroke-width="1.2" stroke-linecap="round">
          <path d="M176 110h-11M176 114l-10 3M218 110h11M218 114l10 3"/>
        </g>
      </g>
      <!-- front paws -->
      <g fill="#14100e" stroke="#4a3527" stroke-width="1.5">
        <ellipse cx="212" cy="134" rx="13" ry="6"/>
        <ellipse cx="236" cy="135" rx="13" ry="6"/>
      </g>
    </g>

    <!-- zzz -->
    <g fill="#ffd79a" font-family="ui-monospace,monospace" font-weight="700">
      <text x="222" y="82" font-size="11" opacity="0">z
        <animate attributeName="opacity" values="0;.9;0" dur="4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;8 -16" dur="4s" repeatCount="indefinite"/>
      </text>
      <text x="234" y="72" font-size="14" opacity="0">z
        <animate attributeName="opacity" values="0;.8;0" dur="4s" begin="1.3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;10 -20" dur="4s" begin="1.3s" repeatCount="indefinite"/>
      </text>
      <text x="248" y="60" font-size="17" opacity="0">z
        <animate attributeName="opacity" values="0;.65;0" dur="4s" begin="2.6s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0;12 -24" dur="4s" begin="2.6s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
</svg>
